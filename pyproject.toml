[project]
name = "fnirsi-dps150"
version = "0.1.0"
description = "Synchronous Python control library for the FNIRSI DPS150."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
]
